name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Build web assets (Vite)
        run: npm run build

      - name: Sync Capacitor web assets into Android
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BerryFilm-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Đổi tên file APK kèm số thứ tự bản build
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BerryFilm-latest.apk

      - name: Tạo Release kèm file APK (hiện ngay trên trang chính repo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BerryFilm build #${{ github.run_number }}
          files: BerryFilm-latest.apk
          make_latest: true